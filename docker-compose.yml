# Local development database. The app and worker join this file on Day 34.
#   docker compose up -d       start Postgres
#   npm run db:migrate         create or update the tables
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: openvisibility
      POSTGRES_PASSWORD: openvisibility
      POSTGRES_DB: openvisibility
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openvisibility -d openvisibility"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
